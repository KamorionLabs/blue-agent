version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Let new releases settle before proposing them (supply-chain safety)
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /src/docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns:
          - "*"
  - package-ecosystem: helm
    directory: /src/helm/blue-agent
    schedule:
      interval: weekly
    groups:
      helm:
        patterns:
          - "*"
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    groups:
      gitsubmodule:
        patterns:
          - "*"
