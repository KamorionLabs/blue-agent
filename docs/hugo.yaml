baseURL: https://kamorionlabs.github.io/blue-agent/
languageCode: en-us
theme: hextra
title: Blue Agent

enableGitInfo: true
enableRobotsTXT: true
enableEmoji: true

imaging:
  quality: 75
  resampleFilter: MitchellNetravali

defaultContentLanguage: en
languages:
  en:
    languageName: English

# Hextra built-in shortcodes
enableInlineShortcodes: true
markup:
  # Root page
  goldmark:
    renderer:
      unsafe: true
  # Syntax highlighting
  highlight:
    noClasses: false

menu:
  main:
    - name: Documentation
      pageRef: /docs
      weight: 1
    - name: About
      pageRef: /about
      weight: 2
    - name: Releases ↗
      weight: 3
      url: https://github.com/KamorionLabs/blue-agent/releases
    - name: Container registry ↗
      weight: 4
      url: https://github.com/KamorionLabs/blue-agent/pkgs/container/blue-agent
    - name: Search
      weight: 5
      params:
        type: search
    - name: GitHub ↗
      weight: 6
      url: "https://github.com/KamorionLabs/blue-agent"
      params:
        icon: github
  sidebar:
    - name: More
      params:
        type: separator
      weight: 1
    - name: "Azure Pipelines docs ↗"
      url: https://learn.microsoft.com/en-us/azure/devops/pipelines/?view=azure-devops
    - name: "Azure DevOps docs ↗"
      url: https://learn.microsoft.com/en-us/azure/devops/?view=azure-devops
    - name: "Original project ↗"
      url: https://github.com/clemlesne/blue-agent

params:
  description: Deploy Azure Pipelines agents on Kubernetes, auto-scaled with KEDA. Windows and Linux, amd64 and arm64. KamorionLabs fork of clemlesne/blue-agent.
  navbar:
    logo:
      dark: favicon-dark.svg
      path: favicon.svg
  footer:
    displayCopyright: true
  displayUpdatedDate: true
  editURL:
    enable: true
    base: https://github.com/KamorionLabs/blue-agent/edit/main/docs/content
