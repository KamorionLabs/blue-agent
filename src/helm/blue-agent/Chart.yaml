apiVersion: v2
name: blue-agent
description: Deploy Azure Pipelines agent on Kubernetes. Easy way. Cheap. Windows and Linux. X64 and ARM compatible.
type: application
# Using ephemeral storage, as from Kubernetes 1.19+ (alpha)
# Explicitely specify selecting SemVer pre-version, as some providers are not following SemVer properly
# See: https://github.com/helm/helm/issues/10375#issuecomment-974203557
kubeVersion: ">= 1.19.0-0"
version: 0.0.0
appVersion: 0.0.0
icon: https://raw.githubusercontent.com/KamorionLabs/blue-agent/main/docs/static/favicon.svg
keywords:
  - agent
  - auto-scale
  - azure
  - azure-devops
  - azure-pipelines
  - container
  - devops
  - docker
  - helm
  - keda
  - kubernetes
  - pipelines
  - self-hosted
  - self-hosted-agent
home: https://kamorionlabs.github.io/blue-agent
sources:
  - https://github.com/KamorionLabs/blue-agent
  # Original project, created by Clémence Lesné
  - https://github.com/clemlesne/blue-agent
maintainers:
  - name: KamorionLabs
    url: https://github.com/KamorionLabs
annotations:
  artifacthub.io/category: integration-delivery
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Documentation
      url: https://kamorionlabs.github.io/blue-agent
    - name: Original project
      url: https://github.com/clemlesne/blue-agent
  artifacthub.io/prerelease: "false"
