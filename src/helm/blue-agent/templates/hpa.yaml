{{- if and (.Values.autoscaling.enabled) (.Capabilities.APIVersions.Has "keda.sh/v1alpha1") -}}
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ include "blue-agent.fullname" . }}
  labels:
    {{- include "blue-agent.labels" . | nindent 4 }}
spec:
  {{- $kedaAuth := include "blue-agent.kedaAuthType" . }}
  {{- if and .Values.secret.create .Values.secret.azureKeyVault.enabled (.Capabilities.APIVersions.Has "secrets-store.csi.x-k8s.io/v1") }}
  # Azure Key Vault secret authentication provider, for KEDA
  azureKeyVault:
    vaultUri: {{ printf "https://%s.vault.azure.net" (.Values.secret.azureKeyVault.name | required "A value for .Values.secret.azureKeyVault.name is required") | quote }}
    podIdentity:
      provider: azure-workload
      identityId: {{ .Values.secret.azureKeyVault.managedIdentityId | quote | required "A value for .Values.secret.azureKeyVault.managedIdentityId is required" }}
    secrets:
      - parameter: organizationURL
        name: organization-url
      - parameter: personalAccessToken
        name: personal-access-token
  {{- else }}
  # Secret is backed natively by Kubernetes
  secretTargetRef:
    - parameter: organizationURL
      name: {{ include "blue-agent.secretName" . }}
      key: organizationURL
    {{- if eq $kedaAuth "pat" }}
    - parameter: personalAccessToken
      name: {{ include "blue-agent.secretName" . }}
      key: personalAccessToken
    {{- end }}
  {{- if eq $kedaAuth "servicePrincipal" }}
  # Microsoft Entra service principal, requires KEDA >= 2.21
  azureServicePrincipal:
    tenantId: {{ .Values.pipelines.auth.tenantId | required "A value for .Values.pipelines.auth.tenantId is required" | quote }}
    clientId: {{ .Values.pipelines.auth.clientId | required "A value for .Values.pipelines.auth.clientId is required" | quote }}
    clientSecret:
      valueFrom:
        secretKeyRef:
          name: {{ include "blue-agent.secretName" . }}
          key: clientSecret
  {{- else if eq $kedaAuth "workloadIdentity" }}
  # Microsoft Entra Workload ID of the KEDA operator
  podIdentity:
    provider: azure-workload
    {{- $identityId := .Values.autoscaling.auth.identityId }}
    {{- if and (not $identityId) (eq (include "blue-agent.agentAuthType" .) "workloadIdentity") }}
    {{- $identityId = .Values.pipelines.auth.clientId }}
    {{- end }}
    {{- with $identityId }}
    identityId: {{ . | quote }}
    {{- end }}
  {{- end }}
  {{- end }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: {{ include "blue-agent.fullname" . }}
  labels:
    {{- include "blue-agent.labels" . | nindent 4 }}
spec:
  # Historical jobs cleanup
  failedJobsHistoryLimit: {{ .Values.pipelines.cleanup.failed | int | required "A value for .Values.pipelines.cleanup.failed is required" }}
  successfulJobsHistoryLimit: {{ .Values.pipelines.cleanup.successful | int | required "A value for .Values.pipelines.cleanup.successful is required" }}
  # Min/max replicas
  maxReplicaCount: {{ .Values.autoscaling.maxReplicas | int | required "A value for .Values.autoscaling.maxReplicas is required" }}
  minReplicaCount: {{ .Values.autoscaling.minReplicas | int | required "A value for .Values.autoscaling.minReplicas is required" }}
  # Target job to scale
  jobTargetRef:
    activeDeadlineSeconds: {{ .Values.pipelines.timeout | int | required "A value for .Values.pipelines.timeout is required" }}
    backoffLimit: 0 # Do not retry
    parallelism: 1 # Only one pod at a time
    ttlSecondsAfterFinished: {{ .Values.pipelines.cleanup.ttl | int | required "A value for .Values.pipelines.cleanup.ttl is required" }}
    template:
      metadata:
        labels:
          {{- include "blue-agent.labels" . | nindent 10 }}
          {{- with (include "blue-agent.workloadIdentityPodLabels" . | trim) }}{{ . | nindent 10 }}{{- end }}
        annotations:
          # Cluster autoscaler never evicts this Pod
          cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
          {{- with .Values.annotations }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
      spec:
        {{- $data := dict
          "azpAgentName" (dict "valueFrom" (dict "fieldRef" (dict "apiVersion" "v1" "fieldPath" "metadata.name" )))
          "isTemplateJob" "0"
          "idleTimeout" (required "A value for .Values.autoscaling.idleTimeout is required" .Values.autoscaling.idleTimeout | int | toString)
          "restartPolicy" "Never"
        }}
        {{- include "blue-agent.podSharedTemplate" (merge (dict "Args" $data) . ) | nindent 8 }}
  # Do not delete executed jobs during upgrade
  rollout:
    strategy: gradual
  {{- $strategy := .Values.autoscaling.scalingStrategy | required "A value for .Values.autoscaling.scalingStrategy is required" }}
  {{- $hasCron := gt (len .Values.autoscaling.schedules) 0 }}
  {{- range .Values.autoscaling.extraTriggers }}
  {{- if eq (toString .type) "cron" }}
  {{- $hasCron = true }}
  {{- end }}
  {{- end }}
  {{- if and $hasCron (not (and (eq $strategy "default") (eq (toString .Values.autoscaling.scaleOnInFlight) "true"))) }}
  {{- fail "autoscaling.schedules and cron extraTriggers require autoscaling.scalingStrategy \"default\" and autoscaling.scaleOnInFlight true (KEDA >= 2.21): with \"accurate\", KEDA would create new agents at every polling interval while warm agents are idle" }}
  {{- end }}
  # See: https://keda.sh/docs/latest/reference/scaledjob-spec/#scalingstrategy
  # "accurate" expects the queue length to exclude the jobs already assigned to an agent (scaleOnInFlight false), "default" expects it to include them (scaleOnInFlight true)
  scalingStrategy:
    strategy: {{ $strategy | quote }}
    multipleScalersCalculation: {{ .Values.autoscaling.multipleScalersCalculation | required "A value for .Values.autoscaling.multipleScalersCalculation is required" | quote }}
  # Rules to scale up/down
  pollingInterval: {{ .Values.autoscaling.pollingInterval | int | required "A value for .Values.autoscaling.pollingInterval is required" }}
  triggers:
    - type: azure-pipelines
      metadata:
        poolName: {{ .Values.pipelines.poolName | quote | required "A value for .Values.pipelines.poolName is required" }}
        parent: {{ include "blue-agent.fullname" . }}-template
        {{- if not (kindIs "invalid" .Values.autoscaling.scaleOnInFlight) }}
        # Count the jobs already assigned to an agent (KEDA >= 2.21, ignored by older versions)
        scaleOnInFlight: {{ .Values.autoscaling.scaleOnInFlight | toString | quote }}
        {{- end }}
      authenticationRef:
        name: {{ include "blue-agent.fullname" . }}
    {{- range .Values.autoscaling.schedules }}
    # Warm agents on a schedule
    - type: cron
      metadata:
        timezone: {{ .timezone | default "Etc/UTC" | quote }}
        start: {{ .start | required "A value for .Values.autoscaling.schedules[].start is required" | quote }}
        end: {{ .end | required "A value for .Values.autoscaling.schedules[].end is required" | quote }}
        desiredReplicas: {{ .desiredReplicas | required "A value for .Values.autoscaling.schedules[].desiredReplicas is required" | int | toString | quote }}
    {{- end }}
    {{- with .Values.autoscaling.extraTriggers }}
    # Custom triggers
    {{- tpl (toYaml .) $ | nindent 4 }}
    {{- end }}
{{- end }}
