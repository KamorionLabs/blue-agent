{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "blue-agent.serviceAccountName" . }}
  labels:
    {{- include "blue-agent.labels" . | nindent 4 }}
  {{- $annotations := deepCopy (.Values.serviceAccount.annotations | default dict) }}
  {{- if eq (include "blue-agent.agentAuthType" .) "workloadIdentity" }}
  {{- $_ := set $annotations "azure.workload.identity/client-id" (.Values.pipelines.auth.clientId | required "A value for .Values.pipelines.auth.clientId is required") }}
  {{- with .Values.pipelines.auth.tenantId }}
  {{- $_ := set $annotations "azure.workload.identity/tenant-id" . }}
  {{- end }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
