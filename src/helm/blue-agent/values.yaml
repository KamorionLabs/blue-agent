# Container image configuration
image:
  # Container image flavor, default is "bookworm"
  flavor: bookworm
  # Indicates if the image is for Windows, default is false
  isWindows: false
  # Image pull policy, default is "Always"
  pullPolicy: Always
  # Container image repository
  repository: ghcr.io/clemlesne/blue-agent
  # Overrides the image tag, default is the chart "appVersion"
  version: ""

# Overrides the full name of the release
fullnameOverride: ""
# Specifies image pull secrets
imagePullSecrets: []
# Overrides the name of the release
nameOverride: ""

# Number of replica agents
replicaCount: 3

# Autoscaling configuration
autoscaling:
  # Enables autoscaling
  enabled: true
  # Minimum number of replicas
  minReplicas: 0
  # Maximum number of replicas, default is 100 to prevent misconfiguration
  maxReplicas: 100
  # Interval in seconds to poll for new jobs
  # Warning: A low value will cause rate limiting or throttling, and can cause high load on the Azure DevOps API
  pollingInterval: 10
  # Seconds an auto-scaled agent waits for a job before it is removed from the pool and its pod exits, 0 disables it
  # A KEDA job can be created for a queued pipeline job that another agent picks up first, this delay cleans it up
  # Raise it to reduce agent churn when keeping warm agents (see "minReplicas")
  idleTimeout: 60
  # KEDA ScaledJob scaling strategy: "accurate" (with scaleOnInFlight false) or "default" (with scaleOnInFlight true)
  # See: https://keda.sh/docs/latest/reference/scaledjob-spec/#scalingstrategy
  scalingStrategy: accurate
  # Count the pipeline jobs already assigned to an agent in the queue length (KEDA >= 2.21, ignored by older versions), null to omit it
  scaleOnInFlight: false
  # How KEDA combines the values of several triggers: max, min, avg or sum
  multipleScalersCalculation: max
  # Warm agents on a schedule, rendered as KEDA cron triggers combined with the Azure Pipelines trigger
  # Requires scalingStrategy "default" and scaleOnInFlight true (KEDA >= 2.21)
  #
  # Example, 2 warm agents on weekdays from 8:00 to 19:00, scale to zero at night and on weekends:
  #
  # schedules:
  #   - timezone: Europe/Paris
  #     start: "0 8 * * 1-5"
  #     end: "0 19 * * 1-5"
  #     desiredReplicas: 2
  schedules: []
  # Additional KEDA triggers for the ScaledJob, templated
  # See: https://keda.sh/docs/latest/scalers/
  extraTriggers: []

# Pipeline configuration
pipelines:
  # Capabilities of the pipeline
  capabilities: []
  # URL of the Azure DevOps organization
  organizationURL: null
  # Personal access token for authentication
  personalAccessToken: null
  # Name of the agent pool
  poolName: null
  # Timeout in seconds, default is 1 hour
  timeout: 3600
  # Cleanup policy for jobs
  cleanup:
    # Number of failed jobs to retain
    failed: 100
    # Number of successful jobs to retain
    successful: 100
    # Time to live for job cleanup in seconds, default is 1 hour
    ttl: 3600
  # Cache configuration
  cache:
    # Size of the cache, default is 10Gi
    size: 10Gi
    # StorageClass of the cache volume, the cluster default StorageClass is used if empty
    # Examples: "managed-csi" or "managed-csi-premium" on AKS, "gp3" on EKS (StorageClass to create with the EBS CSI driver)
    type: null
    # Enables the cache volume, default is true
    volumeEnabled: true
  # Temporary directory configuration
  tmpdir:
    # Size of the temp directory, default is 1Gi
    size: 1Gi
    # StorageClass of the temp directory volume, the cluster default StorageClass is used if empty
    type: null
    # Enables the temp directory volume, default is true
    volumeEnabled: true

# Secret configuration
secret:
  # Indicates if the secret should be managed by the chart
  create: true
  # Name of the secret, auto-generated if not set
  name: ""
  azureKeyVault:
    # Indicates if the secrets "organization-url" and "personal-access-token" should be read from Azure Key Vault, with the Secrets Store CSI Driver for the agents and the KEDA Azure Key Vault provider for the scaler
    # Requires the Secrets Store CSI Driver with the Azure provider, and KEDA configured with Microsoft Entra Workload ID (see: https://keda.sh/docs/latest/authentication-providers/azure-ad-workload-identity)
    enabled: false
    # Indicates if the VM (node) managed identity should be used by the Secrets Store CSI Driver, instead of Microsoft Entra Workload ID
    useVMManagedIdentity: null
    # Client ID of the Entra ID managed identity, used by the Secrets Store CSI Driver and by KEDA
    managedIdentityId: null
    # Name of the Azure Key Vault resource
    name: null
    # Tenant ID of the Azure Key Vault resource
    tenantId: null

# Service account configuration
serviceAccount:
  # Annotations for the service account
  annotations: {}
  # Indicates if a service account should be created
  create: true
  # Name of the service account, auto-generated if not set
  name: ""

# Pod security context configuration
#
# Example, to be used with img or BuildKit:
#
# podSecurityContext:
#   procMount: Unmasked
podSecurityContext: {}

# Container security context configuration
#
# Example:
#
# securityContext:
#   capabilities:
#     drop:
#     - ALL
#   readOnlyRootFilesystem: true
#   runAsNonRoot: true
#   runAsUser: 1000
securityContext: {}

# Resources configuration for the agent container
resources:
  # Resource limits
  limits:
    cpu: 2
    ephemeral-storage: 8Gi
    memory: 4Gi
  # Resource requests
  requests:
    cpu: 1
    ephemeral-storage: 2Gi
    memory: 2Gi

# Additional node selectors
extraNodeSelectors: {}

# Pod tolerations
tolerations: []

# Pod affinity configuration
#
# Example, prefer spot nodes provisioned by Karpenter, falling back to on-demand nodes:
#
# affinity:
#   nodeAffinity:
#     preferredDuringSchedulingIgnoredDuringExecution:
#       - weight: 100
#         preference:
#           matchExpressions:
#             - key: karpenter.sh/capacity-type
#               operator: In
#               values: ["spot"]
affinity: {}

# Use the host's user namespace, set to false to run the agent in its own user namespace (Linux only)
# Root in the container is then mapped to an unprivileged user on the node
# Requires Kubernetes >= 1.33 (or the UserNamespacesSupport feature gate), a compatible container runtime and kernel
# See: https://kubernetes.io/docs/concepts/workloads/pods/user-namespaces/
# If unset, Kubernetes defaults to true
hostUsers: null

# Pod topology spread constraints, templated (e.g. to reuse the chart selector labels)
#
# Example, spread agents across zones:
#
# topologySpreadConstraints:
#   - maxSkew: 1
#     topologyKey: topology.kubernetes.io/zone
#     whenUnsatisfiable: ScheduleAnyway
#     labelSelector:
#       matchLabels:
#         app.kubernetes.io/instance: "{{ .Release.Name }}"
topologySpreadConstraints: []

# Priority class of the agent pods, empty uses the cluster default
priorityClassName: ""

# Number of revisions to keep in the history of the Deployment
revisionHistoryLimit: 10

# Annotations for scheduling and security behaviors
#
# Example, to be used with img or BuildKit:
#
# annotations:
#   container.apparmor.security.beta.kubernetes.io/azp-agent: unconfined
#   container.seccomp.security.alpha.kubernetes.io/azp-agent: unconfined
annotations: {}

# Additional environment variables for the agent container
#
# Example:
#
# - name: XXX
#   value: YYY
#
# Or, reference to a secret or configmap:
#
# - name: SPECIAL_LEVEL_KEY
#   valueFrom:
#     configMapKeyRef:
#       name: special-config
#       key: special.how
# - name: SECRET_KEY
#   valueFrom:
#     secretKeyRef:
#       name: secret-name
#       key: secret.key
extraEnv: []

# Additional volumes for the agent pod
#
# Example:
#
# extraVolumes:
#   - name: config-volume
#     configMap:
#      name: special-config
extraVolumes: []

# Additional volume mounts for the agent container
#
# Example:
#
# extraVolumeMounts:
#   - name: config-volume
#     mountPath: /etc/special
#     readOnly: true
extraVolumeMounts: []

# Initialization containers for the agent pod
#
# Example:
#
# initContainers:
#   - name: init-container
#     image: busybox
#     command: ["/bin/sh", "-c", "echo Hello World"]
initContainers: []

# Extra Kubernetes manifests to deploy
#
# Example:
#
# extraManifests:
# - apiVersion: v1
#   kind: Secret
#   metadata:
#   labels:
#     name: azure-pipeline-secret
#   data:
#     personalAccessToken: "value"
#     organizationURL: "value"
extraManifests: []

# Containers to run alongside the agent container
#
# Example:
#
# sidecarContainers:
#   - name: my-sidecar
#     image: awesome-project/my-sidecar-image
#     imagePullPolicy: Always
#     ports:
#     - name: my-port
#       containerPort: 5000
#       protocol: TCP
#     resources:
#       requests:
#         memory: 10Mi
#         cpu: 10m
#       limits:
#         memory: 100Mi
#         cpu: 100m
sidecarContainers: []
